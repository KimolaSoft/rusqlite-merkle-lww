[workspace]
resolver = "2"
members = [
    "crates/merkle-lww-model",
    "crates/merkle-lww-protocol",
    "crates/merkle-lww-core",
    "crates/merkle-lww-axum",
    "crates/merkle-lww-cli",
    "crates/merkle-lww-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KimolaSoft/rusqlite-merkle-lww"
documentation = "https://docs.rs/merkle-lww-model"

[workspace.dependencies]
merkle-lww-model = { path = "crates/merkle-lww-model", version = "0.1.0" }
merkle-lww-protocol = { path = "crates/merkle-lww-protocol", version = "0.1.0" }
merkle-lww-core = { path = "crates/merkle-lww-core", version = "0.1.0" }
merkle-lww-axum = { path = "crates/merkle-lww-axum", version = "0.1.0" }
merkle-lww-demo = { path = "crates/merkle-lww-demo", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
